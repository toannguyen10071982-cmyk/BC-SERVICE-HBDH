const $=id=>document.getElementById(id),f=(n,d=0)=>Number(n).toLocaleString('vi-VN',{maximumFractionDigits:d});
const cl=p=>p>=1?'ok':p>=.85?'wn':'bad',pc=p=>f(p*100,1)+'%',sum=a=>a.reduce((s,x)=>s+x,0);
const TABS=D.tabs;let cur=0,mo=D.mo,charts={};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();
const plug={id:'v100',afterDatasetsDraw(ch){const{ctx,chartArea:a,scales:{y}}=ch,P=ch.options.plugins.v100.pct;
 ctx.save();if(P){const Y=y.getPixelForValue(100);ctx.strokeStyle=css('mu');ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(a.left,Y);ctx.lineTo(a.right,Y);ctx.stroke();ctx.setLineDash([])}
 ctx.fillStyle=css('tx');ctx.font='10px system-ui';ctx.textAlign='center';
 ch.data.datasets.forEach((d,i)=>ch.getDatasetMeta(i).data.forEach((b,j)=>{if(d.data[j]!=null)ctx.fillText(P?f(d.data[j])+'%':f(d.data[j],1),b.x,b.y-4)}));ctx.restore()}};
function bar(id,labels,sets,single,pct=true){
 if(charts[id])charts[id].destroy();
 const mu=css('mu'),bd=css('bd'),u=pct?'%':'';
 charts[id]=new Chart($(id),{type:'bar',data:{labels,datasets:sets.map((s,i)=>({label:s.l,data:s.d,
  backgroundColor:single?s.d.map(x=>x==null?css('mu'):css(cl(x/100))):css('s'+(i+1)),borderRadius:3,maxBarThickness:34}))},
  plugins:[plug],options:{responsive:true,maintainAspectRatio:false,animation:false,layout:{padding:{top:16}},
  plugins:{v100:{pct},legend:{display:!single,labels:{color:mu}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+f(c.parsed.y,1)+u}}},
  scales:{x:{ticks:{color:mu,maxRotation:60,minRotation:0},grid:{display:false}},y:{beginAtZero:true,ticks:{color:mu,callback:v=>v+u},grid:{color:bd}}}}});
}
const kpi=a=>a.map(x=>`<div class="c"><div class="k">${x[0]}</div><div class="v ${x[1]==null?'':cl(x[1])}">${x[1]==null?'-':pc(x[1])}</div><div class="sub">${x[2]}</div></div>`).join('');
const rt=(k,i)=>{const c=D.M[k].ct[i],t=D.M[k].th[i];return c&&t!=null?t/c*100:null};
const wn=()=>D.W.length?`<div class="c" style="border-color:var(--wn)"><b>Lưu ý dữ liệu</b>${D.W.map(x=>'<div class="sub">• '+x+'</div>').join('')}</div>`:'';
const card=(h,note,id)=>`<div class="c"><h2>${h}</h2><div class="sc"><div class="ch"><canvas id="${id}"></canvas></div></div>${note?'<div class="sub">'+note+'</div>':''}</div>`;

const tb=t=>t?`<div class="c sc"><table><tr>${t.h.map(x=>'<th>'+x+'</th>').join('')}</tr>${t.r.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')}</table></div>`:'';
function render(){
 const t=D.T[cur];D.W=t.W;
 $('hs').textContent='Báo cáo tháng 10 và kế hoạch tháng 11/2026 · Doanh thu: triệu đồng · mỗi nút là một sheet';
 $('tabs').innerHTML=TABS.map((x,i)=>`<button class="${i==cur?'on':''}" onclick="cur=${i};render()">${x}</button>`).join('');
 Object.values(charts).forEach(c=>c.destroy());charts={};
 $('main').innerHTML=`<div class="g">${kpi(t.K)}</div>`+t.ch.map((c,i)=>card(c.t,'','c'+i)).join('')+`<div class="c"><h2>Nhận xét</h2>${t.s.map(x=>'<div class="p">• '+x+'</div>').join('')}</div><div class="c ac"><h2>Đề xuất hành động tháng 11</h2>${t.a.map((x,i)=>'<div class="p">'+(i+1)+'. '+x+'</div>').join('')}</div>`+tb(t.tb)+wn();
 t.ch.forEach((c,i)=>bar('c'+i,c.l,c.s,c.single,c.pct));
}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',render);
render();
